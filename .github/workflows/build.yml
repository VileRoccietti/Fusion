name: Build Fusion (iOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          else
            echo "Defaulting to active Xcode..."
          fi
          
          xcodebuild -version

      - name: Build & Archive iOS App
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project Fusion.xcodeproj \
            -scheme Fusion \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Fusion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build/xcodebuild.log || true

          if [ ! -d "build/Fusion.xcarchive" ]; then
            echo "::error title=Build Failure::Xcodebuild archive failed."
            while IFS= read -r line; do
              echo "::error title=Xcodebuild::$line"
            done < <(grep -E "error:|fatal error:" build/xcodebuild.log | head -n 30)

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-logs
            git add -f build/xcodebuild.log
            git commit -m "ci: diagnostic build log [skip ci]" || true
            git push -f origin ci-logs || true
            exit 65
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcodebuild-Log
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Package Unsigned IPA (For TrollStore, AltStore, Sideloadly)
        run: |
          mkdir -p build/Payload
          cp -r build/Fusion.xcarchive/Products/Applications/Fusion.app build/Payload/
          cd build
          zip -qr Fusion.ipa Payload
          cd ..
          echo "IPA Size: $(du -h build/Fusion.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fusion-iOS-IPA
          path: build/Fusion.ipa
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Fusion.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
