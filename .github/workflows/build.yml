name: Build Fusion (iOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Run First Launch
        run: |
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          xcrun simctl list runtimes || true

      - name: Build & Archive iOS App
        run: |
          mkdir -p build

          # Temporarily isolate Assets.xcassets during archive to prevent actool simulator runtime lookup in headless CI
          if [ -d "Fusion/Assets.xcassets" ]; then
            mv Fusion/Assets.xcassets Fusion/Assets.xcassets.ci_backup
          fi

          set -o pipefail
          xcodebuild archive \
            -project Fusion.xcodeproj \
            -scheme Fusion \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Fusion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME="" \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build/xcodebuild.log || true

          # Restore Assets.xcassets
          if [ -d "Fusion/Assets.xcassets.ci_backup" ]; then
            mv Fusion/Assets.xcassets.ci_backup Fusion/Assets.xcassets
          fi

          if [ ! -d "build/Fusion.xcarchive" ]; then
            echo "::error title=Build Failure::Xcodebuild archive failed."
            while IFS= read -r line; do
              echo "::error title=Xcodebuild::$line"
            done < <(grep -E "error:|fatal error:" build/xcodebuild.log | head -n 30)

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-logs
            git add -f build/xcodebuild.log
            git commit -m "ci: diagnostic build log [skip ci]" || true
            git push -f origin ci-logs || true
            exit 65
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcodebuild-Log
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Package Unsigned IPA (For TrollStore, AltStore, Sideloadly)
        run: |
          mkdir -p build/Payload
          cp -r build/Fusion.xcarchive/Products/Applications/Fusion.app build/Payload/

          APP_DIR="build/Payload/Fusion.app"
          ICON_SRC="Fusion/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          if [ -f "$ICON_SRC" ]; then
            echo "Embedding AppIcon into Fusion.app..."
            cp "$ICON_SRC" "$APP_DIR/AppIcon.png"
            cp "$ICON_SRC" "$APP_DIR/AppIcon1024x1024.png"
            sips -z 120 120 "$ICON_SRC" --out "$APP_DIR/AppIcon60x60@2x.png" || true
            sips -z 180 180 "$ICON_SRC" --out "$APP_DIR/AppIcon60x60@3x.png" || true
            sips -z 152 152 "$ICON_SRC" --out "$APP_DIR/AppIcon76x76@2x~ipad.png" || true
            sips -z 167 167 "$ICON_SRC" --out "$APP_DIR/AppIcon83.5x83.5@2x~ipad.png" || true
          fi

          if [ -f "$APP_DIR/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon.png" "$APP_DIR/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP_DIR/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP_DIR/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$APP_DIR/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$APP_DIR/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:1 string AppIcon" "$APP_DIR/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName AppIcon" "$APP_DIR/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$APP_DIR/Info.plist" || true
          fi

          cd build
          zip -qr Fusion.ipa Payload
          cd ..
          echo "IPA Size: $(du -h build/Fusion.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fusion-iOS-IPA
          path: build/Fusion.ipa
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Fusion.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
